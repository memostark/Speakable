plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
}

apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: "androidx.navigation.safeargs"

configurations.configureEach {
    // Force hamcrest 2.2 because some libraries like junit and espresso still use 1.3 which is not binary compatible
    // and produces errors like "No static method allOf"
    resolutionStrategy.force 'org.hamcrest:hamcrest-library:2.2'
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId "com.guillermonegrete.tts"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 20
        versionName "1.24.0"
        testInstrumentationRunner "com.guillermonegrete.tts.CustomTestRunner"
        vectorDrawables.useSupportLibrary = true
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation":"$projectDir/schemas".toString(),
                        "room.incremental":"true",
                        "room.expandProjection":"true"
                ]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17) // This sets the JVM target for Kotlin tasks
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    namespace 'com.guillermonegrete.tts'

}

repositories {
    maven { url 'https://dl.bintray.com/android/android-tools' }
}

ext {
    supportLibVersion = '26.1.0'
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {

    // Required -- JUnit 4 framework
    testImplementation 'junit:junit:4.13.2'
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "app.cash.turbine:turbine:1.2.1"
    //  Mockito framework
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.3.0'
    testImplementation "io.mockk:mockk:1.14.11"

    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.gridlayout:gridlayout:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.05.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3.adaptive:adaptive"
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // fragments
    def fragment_version = "1.8.9"
    implementation "androidx.fragment:fragment:$fragment_version"
    implementation "androidx.fragment:fragment-ktx:$fragment_version"
    implementation "androidx.fragment:fragment-compose:$fragment_version"

    // KTX core
    implementation "androidx.core:core-ktx:1.19.0"

    // Google custom tabs
    implementation 'androidx.browser:browser:1.10.0'

    // Firebase OCR
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

    // ML Kit language detection
    implementation 'com.google.android.gms:play-services-mlkit-language-id:17.0.0'

    // Firebase Crashlytics
    implementation 'com.google.firebase:firebase-crashlytics:20.0.6'

    // Room
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"

    // Retrofit
    def retrofit_version = "3.0.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-moshi:$retrofit_version"

    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"

    // Lifecycle-aware components
    def lifecycle_version = "2.10.0"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Coroutines
    def coroutines_version = "1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"

    // Navigation component
    // Java language implementation
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"
    // Kotlin
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Apache IO utils
    implementation 'org.apache.directory.studio:org.apache.commons.io:2.4'

    // Database visualizer
    debugImplementation 'com.github.amitshekhariitbhu.Android-Debug-Database:debug-db:v1.0.7'

    // Dagger 2
    implementation "com.google.dagger:dagger:$dagger_version"
    ksp "com.google.dagger:dagger-compiler:$dagger_version"

    // Hilt
    implementation "com.google.dagger:hilt-android:$dagger_version"
    ksp "com.google.dagger:hilt-android-compiler:$dagger_version"
    ksp "org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0" // hilt requires this for kotlin 2.3.0

    // Hilt testing
    androidTestImplementation "com.google.dagger:hilt-android-testing:$dagger_version"
    kspAndroidTest "com.google.dagger:hilt-compiler:$dagger_version"

    lintChecks "com.google.dagger:dagger-lint-aar:$dagger_version"

    // LeakCanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // Jsoup HTML parser
    implementation 'org.jsoup:jsoup:1.22.2'

    // Okhttp
    implementation(platform("com.squareup.okhttp3:okhttp-bom:5.4.0"))
    implementation("com.squareup.okhttp3:logging-interceptor")
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:5.4.0"

    // Timber logger
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Instrumental testing
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"
    def espressoVersion = "3.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$espressoVersion"
    implementation "androidx.test.espresso:espresso-idling-resource:$espressoVersion"
    implementation "androidx.tracing:tracing:1.3.0"

    debugImplementation "androidx.fragment:fragment-testing-manifest:$fragment_version"
    androidTestImplementation "androidx.fragment:fragment-testing:$fragment_version"

    // Glide Image Library
    implementation 'com.github.bumptech.glide:glide:5.0.7'

    // Readability
    implementation 'net.dankito.readability4j:readability4j:1.0.8'
}

apply plugin: 'com.google.gms.google-services'

